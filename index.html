<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Destiny Director Prototype</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" id="brandBtn" title="Back to Director">
        <span class="brandMark">◈</span>
        <span class="brandText">DIRECTOR</span>
      </div>

      <div class="crumbs" id="crumbs"></div>

      <div class="topbarRight">
        <button class="btn ghost" id="toggleEditorBtn" title="Toggle editor (if present)">Editor</button>
      </div>
    </header>

    <main class="main">
      <section class="stage" id="stage"></section>
    </main>

    <div id="tooltip" class="tooltip" hidden></div>
  </div>

  <script type="module" src="./app.js"></script>

  <!-- Optional editor: safe-load (won't break if missing) -->
  <script>
    const s = document.createElement("script");
    s.type = "module";
    s.src = "./js/editor.js";
    s.onerror = () => console.log("[Editor] editor.js not found (read-only mode).");
    document.head.appendChild(s);
  </script>
</body>
</html>
