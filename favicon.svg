<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0B1020"/>

  <!-- Orbital ring -->
  <circle
    cx="32"
    cy="32"
    r="20"
    fill="none"
    stroke="rgba(120,190,255,0.35)"
    stroke-width="2"
  />

  <!-- Orbit line -->
  <line
    x1="12"
    y1="32"
    x2="52"
    y2="32"
    stroke="rgba(255,255,255,0.18)"
    stroke-width="1"
  />

  <!-- Central body -->
  <circle
    cx="32"
    cy="32"
    r="6"
    fill="#78BEFF"
  />

  <!-- Satellite node -->
  <circle
    cx="46"
    cy="32"
    r="3"
    fill="#78BEFF"
  />
</svg>
